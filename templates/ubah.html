{% extends 'base.html' %}
{% block judul %} Ubah Data Mahasiswa {% endblock %}

{% block JudulKonten %}
    <h3 class="box-title"> Ubah Data Mahasiswa </h3>
{% endblock %}

{% block konten %}
    <form action="{{ url_for('proses_ubah') }}" method="POST">
        {% for row in hasil %}
        <div class="form-group">
            <label>No Induk Mahasiswa</label>
            <input type="hidden" name="nim_ori" value="{{ row.0 }}">
            <input type="text" name="nim" class="form-control" value="{{ row.0 }}" required>
        </div>
        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" name="nama" class="form-control" value="{{ row.1 }}" required>
        </div>
        <div class="form-group">
            <label>Asal</label>
            <input type="text" name="asal" class="form-control" value="{{ row.2 }}" required>
        </div>
        {% endfor %}
        <div class="box-footer">
            <a href="{{ url_for('index') }}" class="btn btn-default"> Cancel </a>
            <button type="submit" class="btn btn-primary pull-right"> Submit </button>
        </div>
    </form>
{% endblock %}
