{% extends 'base.html' %}

{% block title %}Tambah Data Mahasiswa{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header custom-card-header">
                <h4 class="mb-0">Tambah Data Mahasiswa</h4>
            </div>
            <div class="card-body mt-3">
                <form action="/proses_tambah/" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">NIM</label>
                        <input type="text" class="form-control" name="nim" required placeholder="Masukkan NIM">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nama Lengkap</label>
                        <input type="text" class="form-control" name="nama" required placeholder="Masukkan Nama">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Asal</label>
                        <input type="text" class="form-control" name="asal" required placeholder="Masukkan Asal">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">Simpan</button>
                        <a href="/" class="btn btn-light px-4">Batal</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
